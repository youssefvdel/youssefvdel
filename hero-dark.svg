<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Youssef — I build tools, and the systems they run on.">
  <rect width="1280" height="420" fill="#0b0b0c"/>
  <rect x="64" y="72" width="1152" height="1" fill="#242322"/>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.9s" fill="freeze"/>
    <text x="64" y="196" font-family="Georgia, 'Times New Roman', serif" font-size="96" fill="#f2f0ea" letter-spacing="-3">Youssef</text>
    <circle cx="414" cy="187" r="6" fill="#ff5a1f"/>
  </g>

  <clipPath id="line">
    <rect x="0" y="0" width="0" height="420">
      <animate attributeName="width" from="0" to="1000" begin="0.7s" dur="2s" fill="freeze"/>
    </rect>
  </clipPath>
  <text x="66" y="252" clip-path="url(#line)" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#8b8781">I build tools, and the systems they run on.</text>
  <rect x="66" y="230" width="2" height="30" fill="#ff5a1f" opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0.7s" dur="0.01s" fill="freeze"/>
    <animate attributeName="x" from="66" to="1030" begin="0.7s" dur="2s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" begin="2.7s" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <text x="64" y="330" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8b8781" letter-spacing="3">CAIRO, EGYPT</text>
  <text x="1216" y="330" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8b8781" letter-spacing="3">GITHUB.COM/YOUSSEFVDEL</text>

  <rect x="0" y="416" width="0" height="4" fill="#ff5a1f">
    <animate attributeName="width" from="0" to="1280" begin="2.8s" dur="0.9s" fill="freeze"/>
  </rect>
</svg>
